apiVersion: v1
kind: Service
metadata:
  name: desafio-devops-service
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: desafio-devops-app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
